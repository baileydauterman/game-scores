<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Score Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
</head>

<body data-bs-theme="dark">
    <div class="container">
        <!-- Game Selector View -->
        <div class="row p-2">
            <div class="form-floating col-10">
                <select class="form-select" id="gameSelection" aria-label="Floating label select example">
                    <option value="0" selected></option>
                </select>
                <label for="gameSelection" class="ms-2">Select a game</label>
            </div>
            <button type="button" class="btn btn-primary col" title="Add New Game" data-bs-toggle="modal"
                data-bs-target="#newGameModal">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-plus-circle" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                    <path
                        d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                </svg>
            </button>
        </div>

        <!-- Scores View -->
        <div class="m-1">
            <div class="d-flex">
                <h1 class="flex-grow-1">Scores</h1>

                <!-- Edit Scores Button -->
                <button class="btn btn-outline-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                        class="bi bi-pencil-square" viewBox="0 0 16 16">
                        <path
                            d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                        <path fill-rule="evenodd"
                            d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z" />
                    </svg>
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-striped text-end" id="scoresTable">
                    <thead>
                        <tr id="scoresTableHeaders">
                            <th scope="col">#</th>
                        </tr>
                    </thead>
                    <tbody id="scoresTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Leaderboard View -->
        <div class="fixed-bottom m-3">
            <div>
                <h1>Leaderboard</h1>
                <div class="table-responsive">
                    <table class="table table-striped" id="leaderboardTable">
                        <thead>
                            <tr id="leaderboardTableHeaders">
                            </tr>
                        </thead>
                        <tbody id="leaderboardTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="vstack gap-3">
                <button type="button" class="btn btn-primary col" title="Add New Game" id="addRoundToGame"
                    data-bs-toggle="modal" data-bs-target="#newRoundModal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-plus-circle" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                        <path
                            d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                    </svg> Add Round
                </button>
                <div class="hstack gap-3">
                    <button type="button" class="btn btn-outline-danger col" title="Delete Game" data-bs-toggle="modal"
                        data-bs-target="#deleteGameModal">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-trash3" viewBox="0 0 16 16">
                            <path
                                d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5" />
                        </svg>
                        </svg> Delete Game
                    </button>
                    <button type="button" class="btn btn-outline-secondary col" title="Copy Link"
                        id="copyGameLinkButton">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-upload" viewBox="0 0 16 16">
                            <path
                                d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5" />
                            <path
                                d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z" />
                        </svg>
                        </svg> Copy Link
                    </button>
                </div>
            </div>
        </div>

        <!-- New Game Modal -->
        <div class="modal fade" id="newGameModal" tabindex="-1" aria-labelledby="newGameModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="newGameModalLabel">Create a new game</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="newGameNameInput" placeholder="Create new game">
                            <label for="newGameNameInput">Game Name</label>
                        </div>
                        <h2>Add Players</h2>
                        <ul class="list-group list-group-flush" id="playersList">
                        </ul>
                        <div class="visually-hidden">
                            <h1>Players</h1>
                            <ul class="list-group list-group-flush" id="playersList">
                            </ul>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="newGameAddPlayerInput"
                                placeholder="Add New Player">
                            <label for="newGameAddPlayerInput">Player Name</label>
                        </div>
                        <div class="row">
                            <button type="button" class="btn btn-primary col m-3" title="Add New Game"
                                id="addPlayerToNewGameBtn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                    class="bi bi-plus-circle" viewBox="0 0 16 16">
                                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                                    <path
                                        d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                                </svg> Add Player
                            </button>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                            id="closeNewGameModal">Close</button>
                        <button type="button" class="btn btn-primary" id="createNewGameInModal">Create</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- New Round Modal -->
        <div class="modal fade" id="newRoundModal" tabindex="-1" aria-labelledby="newRoundModal" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="newRoundModal">Add Round Scores for Game</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="newRoundModalBody">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                            id="closeNewRoundModalButton">Close</button>
                        <button type="button" class="btn btn-primary" id="submitNewRoundModalButton">Save
                            changes</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Game Modal -->
        <div class="modal fade" id="deleteGameModal" tabindex="-1" aria-labelledby="deleteGameModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="deleteGameModalLabel">You're about to delete </h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        THIS IS IRREVERSIBLE. Are you sure you want to delete this game and all its data?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"
                            id="closeDeleteGameModalButton">No, keep game</button>
                        <button type="button" class="btn btn-danger" id="deleteGameButton">Yes, delete</button>
                    </div>
                </div>
            </div>
        </div>


        <!-- Copied Game Link Toast -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true"
                data-bs-delay="5000">
                <div class="toast-body d-flex">
                    <strong class="flex-grow-1">
                        Shareable link copied to clipboard!
                    </strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="./js/types.js"></script>
<script src="./js/main.js"></script>

</html>
